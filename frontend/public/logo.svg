<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentOps logo">
  <defs>
    <!-- Background gradient: deep indigo → rich violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Node fill gradient -->
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Hub ring gradient -->
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Soft glow filter for nodes -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow for the card -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ── Card background ─────────────────────────────────────────────────── -->
  <rect x="4" y="4" width="192" height="192" rx="42" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Inner border ring for depth -->
  <rect x="4" y="4" width="192" height="192" rx="42" fill="none"
        stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>

  <!-- Subtle diagonal sheen -->
  <rect x="4" y="4" width="192" height="96" rx="42"
        fill="white" opacity="0.04"/>

  <!-- ── Connection lines — outer triangle (dim) ─────────────────────────── -->
  <line x1="100" y1="50" x2="58"  y2="132" stroke="#818cf8" stroke-width="1.8"
        stroke-linecap="round" opacity="0.45"/>
  <line x1="100" y1="50" x2="142" y2="132" stroke="#818cf8" stroke-width="1.8"
        stroke-linecap="round" opacity="0.45"/>
  <line x1="58"  y1="132" x2="142" y2="132" stroke="#818cf8" stroke-width="1.8"
        stroke-linecap="round" opacity="0.45"/>

  <!-- ── Connection lines — hub to each agent (bright) ──────────────────── -->
  <line x1="100" y1="95" x2="100" y2="63"  stroke="#a5b4fc" stroke-width="2.5"
        stroke-linecap="round"/>
  <line x1="100" y1="95" x2="71"  y2="121" stroke="#a5b4fc" stroke-width="2.5"
        stroke-linecap="round"/>
  <line x1="100" y1="95" x2="129" y2="121" stroke="#a5b4fc" stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- ── Agent nodes (outer) ─────────────────────────────────────────────── -->
  <!-- Top node -->
  <circle cx="100" cy="50" r="16" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="50" r="10" fill="#ede9fe"/>
  <circle cx="100" cy="50" r="5"  fill="#4338ca"/>

  <!-- Bottom-left node -->
  <circle cx="58"  cy="132" r="16" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="58"  cy="132" r="10" fill="#ede9fe"/>
  <circle cx="58"  cy="132" r="5"  fill="#4338ca"/>

  <!-- Bottom-right node -->
  <circle cx="142" cy="132" r="16" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="142" cy="132" r="10" fill="#ede9fe"/>
  <circle cx="142" cy="132" r="5"  fill="#4338ca"/>

  <!-- ── Hub (centre / platform) ─────────────────────────────────────────── -->
  <circle cx="100" cy="95" r="22" fill="#312e81" opacity="0.6"/>
  <circle cx="100" cy="95" r="18" fill="url(#hubGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="95" r="12" fill="#818cf8"/>
  <circle cx="100" cy="95" r="6"  fill="white"/>

  <!-- ── Wordmark ─────────────────────────────────────────────────────────── -->
  <text x="100" y="170"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif"
        font-size="20"
        font-weight="800"
        letter-spacing="3.5"
        fill="white"
        opacity="0.95">AGENTOPS</text>
</svg>
